    <center>
        <h1>ココフォリア Log Analyzer [CoC]</h1>
        <div class="describe">
        CCBなどで出した 1d100 の出目の頻度を可視化します。※PC推奨<br>
        [<a href="https://kitsystemyou.github.io/ccf-log-analyzer/usage/" target="_blank">使い方などの詳細</a>
        / <a href="https://kitsystemyou.github.io/ccf-log-analyzer/update_log/" target="_blank">更新履歴</a>]<br>
        <a href="{{url_for('users')}}"> ユーザー毎の出目</a><br>
        ココフォリアのログ(xxx.html)をブラウザで開いたものを↓にコピー&ペーストしてください。
        </div>
        <form action="/index" method="POST">
            <textarea name="input_data" placeholder="(例)&#13;[メイン] 山田　太郎 : CCB<=80 【こぶし（パンチ）】 (1D100<=80) ＞ 96 ＞ 致命的失敗&#13;&#13;[メイン] 田中　花子 : CCB<=60 【目星】 (1D100<=60) ＞ 37 ＞ 成功 &#13;&#13;などのログ">{{ raw_data }}</textarea><br>
            <input type="submit" value="🌟 解 析 🌟">
        </form>

        <hr size="5">
        <div class="graph">
          <canvas id="myBarChart"></canvas>
        </div>
        <div class="crifums">
          <a class = "crifum">クリティカル✨ <span style="color:red; font-size:2rem"> {{ cf["critical_percent"] }}% </span></a><br><br>
          <a class = "crifum">ファンブル💀 <span style="color:#fe0084; font-size:2rem"> {{ cf["fumble_percent"] }}% </span></a><br><br>
          <a class = "crifum">トータル📊 <span style="color:black; font-size:2rem"> {{ cf["total"] }}回 </span></a>
        </div>
        </center>

        <script>
            var ctx = document.getElementById("myBarChart");
            Chart.defaults.global.defaultFontColor = 'black';
            Chart.plugins.register({
            beforeDraw: function(ch){
              var ctx = ch.chart.ctx;
              ctx.fillStyle = 'rgba(255, 255, 255, 1)';
              ctx.fillRect(0, 0, ch.chart.width, ch.chart.height);
              }
            });
            var list_data = {{ data }}
            var bin_max = Math.max(...list_data)
            var myBarChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['1~10', '11~20', '21~30', '31~40', '41~50', '51~60', '61~70', '71~80', '81~90', '91~100'],
                    datasets: [{
                        label: '出目の出た回数',
                        data: list_data,
                        backgroundColor: "#64DB8F",
                        fontSize: '30',
                    }, ]
                },
                options: {
                    animation: {
                      duration: 2000
                    },
                    title: {
                        display: true,
                        text: 'ダイスの女神のご機嫌',
                        fontColor: '#00BE96',
                        fontSize: 30,
                    },
                    scales: {
                        yAxes: [{
                          display: true,
                            scaleLabel: {
                              display: 'true',
                            },
                            ticks: {
                                suggestedMax: bin_max,
                                suggestedMin: 0,
                                stepSize: 5,
                                fontSize: 23,
                                callback: function(value, index, values) {
                                    return value + '回'
                                }
                            }
                        }],
                        xAxes: [{
                          ticks: {
                            fontSize: 20,
                          }
                        }]
                    },
                    legend: {
                      labels: {
                      fontColor: 'black',
                      }
                    }
                }
            });
        </script>
</body>

</html>
