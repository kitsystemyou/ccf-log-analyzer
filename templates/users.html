<!DOCTYPE html>
<html>
<title>Log Analyzer 👾</title>

<head>
  <meta charset="utf-8">
  <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="apple-touch-icon" sizes="120x120" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <meta name="author" content="@log_analyzer_cf">
  <meta name="description" content="ココフォリアのログを解析し、CCBなどで出した 1d100 の出目の頻度を可視化します。">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@log_analyzer_cf">
  <meta property="og:title" content="ココフォリアのログ解析ツール(ForCoC)">
  <meta property="og:description" content="ココフォリアのログを解析し、CCBなどで出した 1d100 の出目の頻度を可視化します。">
  <meta property="og:image" content="https://singsignalyou-test.df.r.appspot.com/static/twitter_card.png">
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.4/dist/Chart.bundle.min.js"></script>
    <link rel="stylesheet" href="/static/index.css">
    <a class="twitter-timeline" data-width="13vw" data-height="90vh" data-theme="dark" href="https://twitter.com/log_analyzer_cf?ref_src=twsrc%5Etfw">Tweets by log_analyzer_cf</a>
    <script>
      //twitter-timeline の data-height を制御する部分
      var windoewHeight = document.getElementsByClassName('twitter-timeline')[0];
      windoewHeight.attributes[2].nodeValue = Math.ceil(window.innerHeight * 0.9)
    </script>
    <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
    <center>
        <h1>ココフォリア Log Analyzer [CoC]</h1>
        <div class="describe">
        CCB(または ccb, CC, cc) で出した出目の頻度を可視化します。<br>
        [<a href="https://github.com/kitsystemyou/ccf-log-analyzer/blob/main/Doc/markdown/usage.md" target="_blank">使い方などの詳細</a>
        / <a href="https://github.com/kitsystemyou/ccf-log-analyzer/blob/main/Doc/markdown/update_log.md" target="_blank">更新履歴</a>]<br>
        <a href="{{url_for('index')}}">全体だけの出目</a><br>
        ココフォリアのログ(xxx.html)をブラウザで開いたものを↓にコピー&ペーストしてください。
        </div>
        <form action="/users" method="POST">
            <textarea name="input_data" placeholder="(例)&#13;[メイン] 山田　太郎 : CCB<=80 【こぶし（パンチ）】 (1D100<=80) ＞ 96 ＞ 致命的失敗&#13;&#13;[メイン] 田中　花子 : CCB<=60 【目星】 (1D100<=60) ＞ 37 ＞ 成功 &#13;&#13;などのログ">{{ raw_data }}</textarea><br>
            <input type="submit" value="🌟 解 析 🌟">
        </form>

        <hr size="5">
        <div class="graph">
        {% for i in data["result"] %}
        <canvas id="a{{loop.index}}"></canvas>
        <hr size="3">
        {% endfor %}
    </center>
        <a href="https://github.com/kitsystemyou/ccf-log-analyzer" target="_blank">Github Repository</a>
        <script>
            {% for i in data["result"] %}
            var username = '{{i["name"]}}';
            var hist_data = {{i["hist_data"]}};
            var ctx = document.getElementById("a{{loop.index}}");
            Chart.defaults.global.defaultFontColor = 'black';
            Chart.plugins.register({
            beforeDraw: function(ch){
              var ctx = ch.chart.ctx;
              ctx.fillStyle = 'rgba(255, 255, 255, 1)';
              ctx.fillRect(0, 0, ch.chart.width, ch.chart.height);
              }
            });
            var list_data = hist_data
            var text = username
            var bin_max = Math.max(...list_data)
            var a{{loop.index}} = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['1~10', '11~20', '21~30', '31~40', '41~50', '51~60', '61~70', '71~80', '81~90', '91~100'],
                    datasets: [{
                        label: '出目の出た回数',
                        data: list_data,
                        backgroundColor: "#64DB8F",
                        fontSize: '30',
                    }, ]
                },
                options: {
                    animation: {
                      duration: 2000
                    },
                    title: {
                        display: true,
                        text: text,
                        fontColor: '#00BE96',
                        fontSize: 30,
                    },
                    scales: {
                        yAxes: [{
                          display: true,
                            scaleLabel: {
                              display: 'true',
                            },
                            ticks: {
                                suggestedMax: bin_max,
                                suggestedMin: 0,
                                stepSize: 5,
                                fontSize: 23,
                                callback: function(value, index, values) {
                                    return value + '回'
                                }
                            }
                        }],
                        xAxes: [{
                          ticks: {
                            fontSize: 20,
                          }
                        }]
                    },
                    legend: {
                      labels: {
                      fontColor: 'black',
                      }
                    }
                }
            });
            
            {% endfor %}
            
        </script>
        </div>
</body>

</html>
